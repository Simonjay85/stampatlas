name: StampAtlas CI

on:
  pull_request:
  push:
    branches: [feat/stamp-atlas-mvp, feat/collector-platform-v2]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stampatlas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/stampatlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm drizzle-kit migrate
      - name: Seed integration test identities
        run: >-
          mysql -h 127.0.0.1 -uroot -proot stampatlas_test -e
          "INSERT INTO users (id, openId, role) VALUES
          (1, 'stampatlas-ci-admin', 'admin'),
          (2, 'stampatlas-ci-reviewer', 'reviewer'),
          (7, 'stampatlas-ci-user', 'user')
          ON DUPLICATE KEY UPDATE role = VALUES(role);"
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
